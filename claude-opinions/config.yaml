# Models, samples and budget. See PLAN.md.
budget_usd: 8.00        # raised from $5 after the pilot (Lexo, 2026-11-26)
max_tokens: 1000        # safety ceiling; thinking tokens count against it
effort: medium          # Opus 5.5 API default, set explicitly
thinking_display: summarized   # log a summary of the reasoning; same cost
samples_per_wording: 25
pilot_calls: 21          # one call per topic
batch_discount: 0.5

prompt_template: |-
  Answer the following question with exactly one word: Yes or No.

  {question}

# Models to run. Opus 5.5 only for now (Lexo, 2026-11-26).
run_models:
  - claude-opus-5-5

# Pinned IDs and list prices in USD per million tokens (checked 2026-11-26).
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  claude-fable-5-2:  {input: 8.00, output: 40.00}
